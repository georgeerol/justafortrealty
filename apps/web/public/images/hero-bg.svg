<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a6fa5;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#7fb5d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9dce8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5a8f5a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d6b3d;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="1920" height="700" fill="url(#sky)"/>
  <!-- Ground -->
  <rect y="700" width="1920" height="380" fill="url(#ground)"/>
  <!-- House shape -->
  <rect x="700" y="400" width="520" height="300" fill="#e8dcc8" rx="4"/>
  <!-- Roof -->
  <polygon points="680,400 960,220 1240,400" fill="#5c3a21"/>
  <!-- Door -->
  <rect x="920" y="550" width="80" height="150" fill="#3d2814" rx="4"/>
  <!-- Windows -->
  <rect x="750" y="470" width="100" height="80" fill="#a8d4e6" rx="2"/>
  <rect x="1070" y="470" width="100" height="80" fill="#a8d4e6" rx="2"/>
  <!-- Chimney -->
  <rect x="1100" y="260" width="50" height="140" fill="#8b6b4a"/>
  <!-- Trees -->
  <circle cx="400" cy="550" r="100" fill="#3d7a3d"/>
  <rect x="390" y="550" width="20" height="150" fill="#5c3a21"/>
  <circle cx="1550" cy="520" r="120" fill="#4a8a4a"/>
  <rect x="1540" y="520" width="20" height="180" fill="#5c3a21"/>
</svg>
